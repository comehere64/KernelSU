name: Build ksud with cross
on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      os:
        required: false
        type: string
        default: ubuntu-latest
      pack_lkm:
        required: false
        type: boolean
        default: false
      pack_ksuinit:
        required: false
        type: boolean
        default: false
jobs:
  build:
    runs-on: ${{ inputs.os }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Download artifacts
      uses: actions/download-artifact@v8
    
    - name: Prepare LKM files
      if: ${{ inputs.pack_lkm }}
      run: |
        cp aarch64-android*-lkm/*_kernelsu.ko ./userspace/mtkd/bin/aarch64/
        cp x86_64-android*-lkm/*_kernelsu.ko ./userspace/mtkd/bin/x86_64/
    
    - name: Prepare ksuinit
      if: ${{ inputs.pack_ksuinit }}
      run: |
        mv ksuinit-aarch64/ksuinit ./userspace/mtkd/bin/aarch64/
        mv ksuinit-x86_64/ksuinit ./userspace/mtkd/bin/x86_64/
        mv ksuinit-riscv64/ksuinit ./userspace/mtkd/bin/riscv64/
        
    - name: Setup rustup
      run: |
        rustup update stable
        if [[ ${{ inputs.target }} == *"-apple-darwin" ]]; then
          rustup target add ${{ inputs.target }}
        fi
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: userspace/mtkd
        cache-targets: false
        cache-bin: false

    - name: Install cross
      run: |
        RUSTFLAGS="" cargo install cross --git https://github.com/cross-rs/cross --rev 66845c1

    - name: Assemble LKM bootstrap
      run: |
        clang --target=aarch64-linux-gnu -c -nostdlib \
          -o userspace/mtkd/.lkm_image_bootstrap.o \
          userspace/mtkd/src/lkm_image_bootstrap.S

    - name: Build ksud
      # windows 目标走的还是 libc 的 unix 接口（webui_files 的 chmod/chown），
      # 编不过属于分叉本身的平台缺口：让它失败但不把整条出包链带下水。
      # 注意 job 级 continue-on-error 不允许引用 matrix/inputs，只能在 step 上写。
      continue-on-error: ${{ inputs.target == 'x86_64-pc-windows-gnu' }}
      run: CROSS_NO_WARNINGS=0 cross build --target ${{ inputs.target }} --release --manifest-path ./userspace/mtkd/Cargo.toml

    - name: Upload ksud artifact
      uses: actions/upload-artifact@v7
      with:
        name: ksud-${{ inputs.target }}
        path: target/${{ inputs.target }}/release/ksud*
