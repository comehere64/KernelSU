android.experimental.enableNewResourceShrinker.preciseShrinking=true
android.enableAppCompileTimeRClass=true
android.useAndroidX=true
org.gradle.jvmargs=-Xmx1536m
org.gradle.parallel=true
org.gradle.tooling.parallel=true
org.gradle.vfs.watch=true
android.r8.maxWorkers=4
android.native.buildOutput=verbose
# The Manager's own launcher name. It is deliberately 24 bytes long — the hidden copy rewrites
# this very string slot in place, so its length is the room a custom name has — but the padding is
# zero-width characters, so what shows on the launcher is just "KernelSU".
KSU_NAME=KernelSU

KEYSTORE_FILE=key.jks
KEYSTORE_PASSWORD=joker2026
KEY_ALIAS=ksu-manager
KEY_PASSWORD=joker2026

# 与本地构建一致的输出身份（CI 跑 ./gradlew clean assembleRelease 不带 -P）
KSU_PACKAGE_NAME=me.weishu.kernelsu
OVERRIDE_VERSION_CODE=32680
OVERRIDE_VERSION_NAME=v3.3.1
